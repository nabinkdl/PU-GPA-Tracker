<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Linear Gradient for background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Shadow for the icon to stand out -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="32" height="32" rx="8" fill="url(#bg-grad)" />
  <!-- Graduation Cap Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#drop-shadow)" transform="translate(4, 4)">
    <!-- Main Cap Top (Diamond) -->
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" fill="rgba(255, 255, 255, 0.12)" />
    <!-- Cap Base / Neck -->
    <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
    <!-- Tassel -->
    <path d="M21.5 12v6" />
  </g>
</svg>
